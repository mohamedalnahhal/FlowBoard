services:
  db:
    image: postgres:16-alpine
    container_name: taskboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-alpine
    container_name: taskboard_backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npx prisma migrate deploy && npx tsx watch src/app.ts"
    ports:
      - "6000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://taskboard:taskboard@db:5432/taskboard?schema=public"
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      # npm install + prisma migrate on boot can take minutes; don't count
      # failures during that window toward the retry limit.
      start_period: 240s

  frontend:
    image: node:22-alpine
    container_name: taskboard_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "6001:3000"
    volumes:
      - ./frontend:/app
      # Keep the container's Next build cache off the host bind mount: mixing
      # host (glibc) and container (musl) builds in one .next corrupts it.
      - /app/.next
    depends_on:
      backend:
        # Wait for the backend healthcheck so Next's first SSR fetches don't
        # hit a booting backend and get stuck in connect-timeout states.
        condition: service_healthy
    environment:
      BACKEND_URL: "http://taskboard_backend:3000"
      HOSTNAME: "0.0.0.0"

volumes:
  postgres_data: