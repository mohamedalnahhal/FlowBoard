services:
  db:
    image: postgres:16-alpine
    container_name: taskboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:22-alpine
    container_name: taskboard_backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && node src/app"
    ports:
      - "6000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    container_name: taskboard_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "6001:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data: