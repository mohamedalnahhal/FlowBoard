services:
  db:
    image: postgres:16-alpine
    container_name: taskboard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-alpine
    container_name: taskboard_backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npx prisma migrate deploy && npx tsx watch src/app.ts"
    ports:
      - "6000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://taskboard:taskboard@db:5432/taskboard?schema=public"
      PORT: "3000"

  frontend:
    image: node:22-alpine
    container_name: taskboard_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "6001:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://taskboard_backend:3000"
      HOSTNAME: "0.0.0.0"

volumes:
  postgres_data: